name: Release

# Builds every platform and publishes a GitHub Release when a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_BIN: markdown-studio
  APP_NAME: Markdown Studio

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,     os: windows-latest, target: x86_64-pc-windows-msvc,   bundles: 'nsis,msi' }
          - { name: windows-x86,     os: windows-latest, target: i686-pc-windows-msvc,     bundles: 'nsis,msi' }
          - { name: windows-arm64,   os: windows-latest, target: aarch64-pc-windows-msvc,  bundles: 'nsis' }
          - { name: linux-x64,       os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb' }
          - { name: macos-universal, os: macos-latest,   target: universal-apple-darwin,   bundles: 'app,dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file libxdo-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2 icon app-icon.png

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $release = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem "$release/bundle" -Recurse -File -Include *.exe, *.msi, *.AppImage, *.deb, *.dmg | Copy-Item -Destination out
          if ('${{ runner.os }}' -eq 'Windows') {
            $arch = '${{ matrix.name }}'.Replace('windows-', '')
            Copy-Item "$release/$env:APP_BIN.exe" ("out/{0}_{1}_{2}_portable.exe" -f $env:APP_NAME.Replace(' ', '-'), $version, $arch)
          }
          Get-ChildItem out | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = (index($0, "## " v " ") == 1 || $0 == "## " v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/**/*

  flatpak:
    name: Flatpak
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist
      - name: Stage .deb for the manifest
        run: cp "$(find dist -name '*.deb' | head -n1)" flatpak/app.deb
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Markdown-Studio_x86_64.flatpak
          manifest-path: flatpak/com.markdownstudio.editor.yml
          cache-key: flatpak-${{ github.sha }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Markdown-Studio_x86_64.flatpak
