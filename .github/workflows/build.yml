name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,     os: windows-latest,   target: x86_64-pc-windows-msvc,    bundles: 'nsis,msi' }
          - { name: windows-x86,     os: windows-latest,   target: i686-pc-windows-msvc,      bundles: 'nsis,msi' }
          - { name: windows-arm64,   os: windows-latest,   target: aarch64-pc-windows-msvc,   bundles: 'nsis' }
          - { name: linux-x64,       os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  bundles: 'appimage,deb' }
          - { name: linux-arm64,     os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'appimage,deb' }
          - { name: macos-universal, os: macos-latest,     target: universal-apple-darwin,    bundles: 'app,dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2 icon app-icon.png

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  flatpak:
    name: flatpak-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-latest,    artifact: linux-x64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, artifact: linux-arm64 }
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: markdown-studio-${{ matrix.artifact }}
          path: dist

      - name: Stage .deb for the manifest
        run: cp "$(find dist -name '*.deb' | head -n1)" flatpak/markdown-studio.deb

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: markdown-studio-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/com.markdownstudio.editor.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
